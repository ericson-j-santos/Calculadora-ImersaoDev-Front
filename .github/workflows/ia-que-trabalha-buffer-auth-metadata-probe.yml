name: IA que Trabalha - Buffer Auth Metadata Probe

on:
  push:
    branches:
      - ops/ia-que-trabalha-buffer
    paths:
      - 'ia-que-trabalha/oauth/metadata-probe-request.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fetch public OAuth metadata
        shell: python
        run: |
          import json
          import urllib.request

          url = "https://auth.buffer.com/.well-known/oauth-authorization-server"
          req = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"iaqt-auth-meta/1.0"})
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))
          allowed = {
              "issuer",
              "authorization_endpoint",
              "token_endpoint",
              "registration_endpoint",
              "device_authorization_endpoint",
              "revocation_endpoint",
              "introspection_endpoint",
              "response_types_supported",
              "response_modes_supported",
              "grant_types_supported",
              "code_challenge_methods_supported",
              "token_endpoint_auth_methods_supported",
              "scopes_supported",
          }
          safe = {k:v for k,v in data.items() if k in allowed}
          print(json.dumps(safe, sort_keys=True))

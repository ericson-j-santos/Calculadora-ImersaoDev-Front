name: IA que Trabalha - Buffer OAuth Probe

on:
  push:
    branches:
      - ops/ia-que-trabalha-buffer
    paths:
      - 'ia-que-trabalha/oauth/probe-request.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Probe Buffer MCP OAuth metadata
        shell: python
        run: |
          import json
          import urllib.error
          import urllib.request

          urls = [
              "https://mcp.buffer.com/mcp",
              "https://mcp.buffer.com/.well-known/oauth-protected-resource",
              "https://mcp.buffer.com/.well-known/oauth-authorization-server",
              "https://auth.buffer.com/.well-known/oauth-authorization-server",
          ]

          for url in urls:
              print("URL", url)
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "ia-que-trabalha-oauth-probe/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(10000).decode("utf-8", errors="replace")
                      print("STATUS", response.status)
                      print("WWW_AUTHENTICATE", response.headers.get("WWW-Authenticate"))
                      if "well-known" in url:
                          try:
                              data = json.loads(body)
                              safe = {
                                  k: v for k, v in data.items()
                                  if k in {
                                      "resource","authorization_servers","issuer",
                                      "authorization_endpoint","token_endpoint",
                                      "registration_endpoint","scopes_supported",
                                      "code_challenge_methods_supported",
                                      "client_id_metadata_document_supported",
                                  }
                              }
                              print("JSON", json.dumps(safe, sort_keys=True))
                          except Exception:
                              print("BODY_PREFIX", body[:500])
              except urllib.error.HTTPError as exc:
                  body = exc.read(10000).decode("utf-8", errors="replace")
                  print("STATUS", exc.code)
                  print("WWW_AUTHENTICATE", exc.headers.get("WWW-Authenticate"))
                  print("BODY_PREFIX", body[:500])
              except Exception as exc:
                  print("ERROR", type(exc).__name__, str(exc)[:300])
              print("---")

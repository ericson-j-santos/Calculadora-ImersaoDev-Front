name: IA que Trabalha - Buffer OAuth One Shot

on:
  push:
    branches:
      - ops/ia-que-trabalha-buffer
    paths:
      - 'ia-que-trabalha/oauth/request.json'

permissions:
  contents: write

concurrency:
  group: ia-que-trabalha-buffer-oauth
  cancel-in-progress: true

jobs:
  oauth-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.2

      - name: Install Cloudflare quick tunnel client
        run: |
          curl --fail --silent --show-error --location             https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64             --output cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      - name: Run ephemeral Buffer OAuth and schedule
        run: python ia-que-trabalha/oauth/oauth_buffer_once.py

name: IAQT Cross Platform Verify

on:
  push:
    branches:
      - ops/iaqt-cross-platform-verify-20260928
    paths:
      - "iaqt-verify/**"
      - ".github/workflows/iaqt-cross-platform-verify.yml"

permissions:
  contents: read

concurrency:
  group: iaqt-cross-platform-verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact push SHA without external action
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$EXPECTED_SHA"
          echo "validated_head_sha=$observed"

      - name: Verify copied blobs match private PR evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          evidence = json.loads(Path("iaqt-verify/source-evidence.json").read_text())
          mapping = {
              "apps/ia-que-trabalha/content/youtube-week1.json": "iaqt-verify/content/youtube-week1.json",
              "apps/ia-que-trabalha/content/tiktok-week1.json": "iaqt-verify/content/tiktok-week1.json",
              "apps/ia-que-trabalha/tests/test_cross_platform_week1.py": "iaqt-verify/tests/test_cross_platform_week1.py",
          }
          for source, target in mapping.items():
              observed = subprocess.check_output(["git", "hash-object", target], text=True).strip()
              expected = evidence["files"][source]
              if observed != expected:
                  raise SystemExit(f"blob_mismatch:{source}:{observed}:{expected}")
              print(f"blob_ok:{source}:{observed}")
          print("source_head_sha=" + evidence["source_head_sha"])
          PY

      - name: Run cross-platform manifest tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s iaqt-verify/tests -p 'test_*.py' -v
